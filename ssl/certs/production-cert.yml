apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-dobson-dev-production
  namespace: default
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.k3s.dobson.dev"
  dnsNames:
  - "k3s.dobson.dev"
  - "*.k3s.dobson.dev"
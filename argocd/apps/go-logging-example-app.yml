apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-logging-example-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.grafana: ""
spec:
  project: default
  source:
    repoURL: https://github.com/dobsondev/homelab.git
    path: argocd/helm/charts/basic-service
    targetRevision: main
    helm:
      values: |
        name: go-logging-example-app
        component: application
        replicaCount: 1
        image:
          repository: ghcr.io/dobsondev/go-logging-example-app
          tag: v0.2.1
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 8080
        ingress:
          enabled: true
          host: go-logging-example-app.k3s.dobson.dev
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "alloy.monitoring.svc.cluster.local:4318"
          - name: SERVICE_NAME
            value: "go-logging-example-app"
  destination:
    namespace: go-logging-example-app
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

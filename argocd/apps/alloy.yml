apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    # https://github.com/grafana/alloy/blob/main/operations/helm/charts/alloy/Chart.yaml
    targetRevision: 1.12.1
    helm:
      values: |
        controller:
          type: daemonset
        rbac:
          create: true
        service:
          enabled: true
        alloy:
          mounts:
            varlog: true
            dockercontainers: true
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          configMap:
            create: true
            content: |
              // --- Logs: replaces Promtail ---
              // Discover every pod on this node and build a __path__ pointing at its
              // kubelet log files, so each Alloy DaemonSet pod only tails its own node
              // (loki.source.kubernetes can't be scoped per-node the same way and would
              // duplicate every log line across all nodes without enabling clustering).
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-stack-gateway/loki/api/v1/push"
                }
              }

              // --- Traces: OTLP gateway in front of Tempo ---
              // Apps send OTLP here instead of straight to Tempo. k8sattributes enriches
              // every span with pod/namespace/node metadata so apps don't have to manage
              // OTEL_RESOURCE_ATTRIBUTES themselves.
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  traces = [otelcol.processor.k8sattributes.default.input]
                }
              }

              otelcol.processor.k8sattributes "default" {
                output {
                  traces = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.batch "default" {
                output {
                  traces = [otelcol.exporter.otlp.tempo.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.monitoring.svc.cluster.local:4317"
                  tls {
                    insecure = true
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
